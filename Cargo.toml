[package]
name = "sunshine"
version = "0.1.0"
edition = "2021"
description = "sunshine — compile claim anchor manifests into tagged, auditable documents (PDF/MD/org/HTML)"
license = "Apache-2.0"
repository = "https://github.com/charly-vibes/sunshine"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
