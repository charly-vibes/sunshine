source = "anchor.manifest"

[[constraints]]
id = "am_schema_version"
kind = "invariant"
expr = "the manifest carries a schema_version; a consumer refuses any version it does not publish support for, with a machine-readable refusal naming the supported set"
traces_to = "[[anchor.manifest]]"

[[constraints]]
id = "am_claim_fields"
kind = "invariant"
expr = "each claim record carries exactly: claim_key, status, text, evidence_span or its typed absent marker, episode lineage of at least one episode id, locator, hedges, and provenance (extractor version, adopting actor, adoption time); confidence scores and embedding blobs never appear"
traces_to = "[[anchor.manifest]]"

[[constraints]]
id = "am_verbatim_span"
kind = "invariant"
expr = "an evidence_span is a verbatim substring of its referenced episode text under the fleet whitespace rule — collapse runs of whitespace to a single space, trim ends, NFC — the one normalization this corpus permits, applied identically at export containment and at join location; a span failing containment exports as the typed absent marker, never silently kept"
traces_to = "[[anchor.manifest]]"

[[constraints]]
id = "am_semantic_locator"
kind = "invariant"
expr = "a locator carries a scheme plus selector payload in the descriptor's selector vocabulary; device coordinates are resolved only at render time, so re-rendering against a corrected descriptor needs no re-export"
traces_to = "[[anchor.manifest]]"

[[constraints]]
id = "am_status_filter"
kind = "invariant"
expr = "an export includes only claims whose status is in the explicitly requested set; the default set is active-only; a proposed claim enters a manifest only when the caller names that status"
traces_to = "[[anchor.manifest]]"

[[constraints]]
id = "am_deterministic_export"
kind = "invariant"
expr = "exporting the same store state with the same options yields a byte-identical manifest under stable claim-key ordering; wall-clock values ride claim provenance records only"
traces_to = "[[anchor.manifest]]"

[[constraints]]
id = "am_digest"
kind = "invariant"
expr = "the manifest carries a content digest over its canonical serialization with the digest field itself excluded from the hashed form; every rendered artifact stamps this digest"
traces_to = "[[anchor.manifest]]"

[[constraints]]
id = "am_strict_parse"
kind = "invariant"
expr = "unknown fields, duplicate claim keys, or references to absent episodes refuse parsing with machine-readable reasons; no field is silently ignored"
traces_to = "[[anchor.manifest]]"

[[constraints]]
id = "am_relations"
kind = "advisory"
expr = "inter-claim relations (supports, contradicts) ride an optional relations section referencing claim keys; relation types come from the closed vocabulary published with the schema"
traces_to = "[[anchor.manifest]]"

[[constraints]]
id = "am_schema_published"
kind = "extension_point"
expr = "the manifest JSON Schema is published for the producer (bajan export) and the consumer (sunshine) to conform to"
traces_to = "[[anchor.manifest]]"

[[constraints]]
id = "am_claim_key_canon"
kind = "invariant"
expr = "a claim_key is a nonempty, non-whitespace-only string; claim-key equality is decided on the NFC form, so two keys differing only by Unicode normalization form denote the same claim and a second occurrence refuses as a duplicate under am_strict_parse; duplicate detection and claim-key ordering both use the normalized key; NFC applies to claim-key equality only — stored claim text and episode text are never normalized by this rule"
traces_to = "[[anchor.manifest]]"
