# Pinned ecosystem tool versions for this repo's CI and dev setup.
# Standardization §4: installs are pinned, never `latest` — a broken release
# of any tool must not break CI of the whole fleet.
# Update deliberately; the conformance test (tests/standard_conformance.rs)
# requires this file to exist.
#
# §4 matrix row (ddl): pretender ✅ · wai ✅ · bd ✅ · openspec ✅ · dont ✅
# CI installs these pinned (see ci.yml).

[tools]
wai = "2026.11.11"         # crates.io: wai-cli — pipeline/session tooling behind .wai/
pretender = "0.11.1"       # crates.io — complexity gate (gate mode + changed-surface diff)
dont = "0.4.2"             # GitHub release (crates.io stops at dont-cli 0.2.2) — checksum-verified tarball install
dulce-de-leche = "0.10.0"  # crates.io (bin: ddl) — self
openspec = "2.1.0"        # npm: @fission-ai/openspec — artifact layout (openspec/config.yaml); agent workflows are project skills in .agents/skills
bd = "1.3.4"               # beads — pinned GitHub release download (no versioned homebrew-core formula)
specodelic = "0.14.0"      # crates.io (bin: spk) — spec-corpus lint gate (`spk lint specs`)
espectacular = "0.12.2"    # crates.io (bin: ah) — spec↔test correspondence, gated through the declared-backlog ratchet (`tools/gates/ah_check_ratchet.py`)
testaruda = "0.5.9"        # crates.io (bins: testaruda + rust/python adapters) — affected-test selection loop behind `just test`
